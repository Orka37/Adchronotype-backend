services:
  - type: web
    name: adchronotype-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adchronotype-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production

databases:
  - name: adchronotype-db
    databaseName: adchronotype
    user: adchronotype
